name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Strata (vector index) from source
        run: |
          pip install cmake ninja
          pip install "git+https://github.com/VividhDesign/strata"
      - name: Install Evident (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit tests (no model downloads, no LLM calls)
        run: pytest -q
